# /work/SPK-OS/soft/basic/new-api/ha/nginx/upstream.conf
# ============================================================
# LLM Gateway Active Upstream
# 当前活跃节点：GREEN
# ============================================================

upstream llm_gateway_active {
    # 活跃节点（接收 100% 流量）
    server new-api-green:3000;

    # 备用节点（backup 模式：仅当活跃节点不可用时自动接管）
    server new-api-blue:3000 backup;

    # 连接池
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    proxy_connect_timeout 30s;
    proxy_read_timeout 600s;
    proxy_send_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cache-Control "no-cache";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://llm_gateway_active;

        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    location = /nginx-status {
        stub_status on;
        access_log off;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;
    }
}
