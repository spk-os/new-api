# ============================================================
# LLM Gateway 高可用部署 - 蓝绿双容器 + Nginx + Redis
# 复用 SPK-OS prod 基础设施 (spk-pg-prod + spk-redis-prod)
# ============================================================

services:
  # ============================================================
  # Nginx 反向代理（对外唯一端口 3500）
  # ============================================================

  nginx:
    image: nginx:alpine
    container_name: llm-gateway-nginx
    restart: "no"
    ports:
      - "3500:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ./nginx/logs:/var/log/nginx
    entrypoint: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    networks:
      - gateway-net
    depends_on:
      - blue
      - green
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Blue 容器（端口 3501）
  # ============================================================

  blue:
    image: ${GATEWAY_IMAGE:-new-api:gateway}
    container_name: new-api-blue
    restart: "no"
    command: --log-dir /app/logs
    ports:
      - "3501:3000"
    volumes:
      - shared_data:/data
      - /root/share/logs/llm/new-api/blue:/app/logs
      - /root/share/ops/logs/new-api:/root/share/ops/logs/new-api
    environment:
      - SQL_DSN=postgresql://${PG_USER:-spk}:${PG_PASSWORD:?PG_PASSWORD must be loaded by gateway-lifecycle.sh}@${PG_HOST:-spk-pg-prod}:${PG_PORT:-5432}/${PG_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be loaded by gateway-lifecycle.sh}@${REDIS_HOST:-spk-redis-prod}:${REDIS_PORT:-6379}/0
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}
      - SYNC_FREQUENCY=10
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=blue
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    networks:
      - gateway-net
      - spk-infra-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Green 容器（端口 3502）
  # ============================================================

  green:
    image: ${GATEWAY_IMAGE:-new-api:gateway}
    container_name: new-api-green
    restart: "no"
    command: --log-dir /app/logs
    ports:
      - "3502:3000"
    volumes:
      - shared_data:/data
      - /root/share/logs/llm/new-api/green:/app/logs
      - /root/share/ops/logs/new-api:/root/share/ops/logs/new-api
    environment:
      - SQL_DSN=postgresql://${PG_USER:-spk}:${PG_PASSWORD:?PG_PASSWORD must be loaded by gateway-lifecycle.sh}@${PG_HOST:-spk-pg-prod}:${PG_PORT:-5432}/${PG_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be loaded by gateway-lifecycle.sh}@${REDIS_HOST:-spk-redis-prod}:${REDIS_PORT:-6379}/0
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}
      - SYNC_FREQUENCY=10
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=green
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    networks:
      - gateway-net
      - spk-infra-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  shared_data:

networks:
  gateway-net:
    driver: bridge
  spk-infra-net:
    external: true        # 复用现有 PG 所在网络
    name: spk-infra-net
