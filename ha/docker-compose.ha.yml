# ============================================================
# LLM Gateway 高可用部署 - 蓝绿双容器 + Nginx + Redis
# 复用现有 PostgreSQL (docker-db_postgres-1, docker_default 网络)
# ============================================================

version: '3.8'

services:
  # ============================================================
  # Redis（专用实例，亲和绑定 + 共享缓存）
  # ============================================================

  redis:
    image: redis:6-alpine
    container_name: new-api-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_2026}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================
  # Nginx 反向代理（对外唯一端口 3500）
  # ============================================================

  nginx:
    image: nginx:alpine
    container_name: llm-gateway-nginx
    restart: always
    ports:
      - "3500:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ./nginx/logs:/var/log/nginx
    entrypoint: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"]
    networks:
      - gateway-net
    depends_on:
      - blue
      - green
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================================
  # Blue 容器（端口 3501）
  # ============================================================

  blue:
    image: ${GATEWAY_IMAGE:-new-api:gateway}
    container_name: new-api-blue
    restart: always
    ports:
      - "3501:3000"
    volumes:
      - shared_data:/data
      - ./logs/blue:/app/logs
    environment:
      - SQL_DSN=postgresql://postgres:${PG_PASSWORD:-difyai123456}@${PG_HOST:-docker-db_postgres-1}:${PG_PORT:-5432}/${PG_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-redis_secure_2026}@new-api-redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}
      - SYNC_FREQUENCY=10
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=blue
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    networks:
      - gateway-net
      - docker_default        # 连接到 PG 所在网络
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================
  # Green 容器（端口 3502）
  # ============================================================

  green:
    image: ${GATEWAY_IMAGE:-new-api:gateway}
    container_name: new-api-green
    restart: always
    ports:
      - "3502:3000"
    volumes:
      - shared_data:/data
      - ./logs/green:/app/logs
    environment:
      - SQL_DSN=postgresql://postgres:${PG_PASSWORD:-difyai123456}@${PG_HOST:-docker-db_postgres-1}:${PG_PORT:-5432}/${PG_DB:-new-api}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD:-redis_secure_2026}@new-api-redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-change_me_in_production}
      - SYNC_FREQUENCY=10
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=green
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
    networks:
      - gateway-net
      - docker_default
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  redis_data:
  shared_data:

networks:
  gateway-net:
    driver: bridge
  docker_default:
    external: true        # 复用现有 PG 所在网络
    name: docker_default
